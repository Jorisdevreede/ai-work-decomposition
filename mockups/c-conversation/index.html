<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183e34">
  <meta name="description" content="Explore an AI native HR team through a conversation and a live team canvas.">
  <title>agentlabs · Conversation first</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23183e34'/%3E%3Cpath d='M8 23V9h6v14m4-9h6v9h-6' stroke='%23d5efb7' stroke-width='3' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#canvas-content">Skip to canvas</a>
  <header class="masthead">
    <a class="brand" href="#/setup" aria-label="agentlabs home"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M4 22V6h7v16M17 13h7v9h-7"/></svg>agentlabs<span class="brand-dot">.</span></a>
    <div class="workspace"><span class="company-symbol">N</span><span>Noordhaven Logistics<span class="slash">/</span><strong>HR team</strong></span></div>
    <span class="demo-label">Interactive sample</span><span class="avatar avatar-lead" title="Femke, HR Manager">FV</span>
  </header>
  <div class="mobile-switch" aria-label="Workspace view"><button data-view="conversation">Conversation<span class="conversation-dot"></span></button><button class="selected" data-view="canvas">Canvas</button></div>
  <div class="app-layout" data-mobile-view="canvas">
    <aside class="conversation" aria-label="Conversation with agentlabs">
      <div class="conversation-heading"><div><span class="status-dot"></span><strong>Your reimagine partner</strong></div><button class="icon-button" id="restart-chat" aria-label="Reset conversation">↻</button></div>
      <div class="conversation-thread" id="conversation-thread" aria-live="polite"></div>
      <div class="conversation-bottom"><div id="agent-suggestions" class="suggestions"></div><form id="chat-form" class="composer"><label class="sr-only" for="message">Message your reimagine partner</label><textarea id="message" placeholder="Ask, add context, or think out loud…" rows="2"></textarea><div class="composer-tools"><button type="button" class="icon-button" data-action="upload-chat" aria-label="Add a source"> <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 12 6-6a4 4 0 0 1 6 6L10 22a6 6 0 0 1-8-8L12 4"/></svg></button><span>Sample conversation</span><button type="button" class="icon-button" data-action="voice-chat" aria-label="Try a voice conversation"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg></button><button class="send-button" type="submit" aria-label="Send message"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></div></form><p class="privacy-note">You decide. The agent helps you see the options.</p></div>
    </aside>
    <section class="canvas" aria-label="Team canvas"><nav class="canvas-nav" aria-label="Canvas screens" id="canvas-nav"></nav><main id="canvas-content" tabindex="-1"></main><footer class="canvas-footer"><span><span class="status-dot"></span> Sample workspace · changes stay in this browser tab</span><span>Direction C · Conversation first</span></footer></section>
  </div>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
